fts_controller:
  use_fts: true
  type: robotrainer_controllers/FTSController
  required_drive_mode: 3
  publish_rate: 50
  max_rot_velocity: 1.0 #0.2
  max_trans_velocity: 1.5 #0.2
  FTSBaseController:
    simulate: False
    update_rate: 200.0
    # trigger inversion of y and rotation outputs
    y_reversed: False
    rot_reversed: False
    # scale for negative x-direction
    backwards_max_force_scale: 0.5
    backwards_max_vel_scale: 0.7 #0.25
    # trigger using controllers
    x_force_controller: True
    y_force_controller: True
    rot_controller: True
    # x-direction parameters
    x_min_force: 3.0        # 5.0
    x_max_force: 100.0
    x_max_vel: 1.2
    x_gain: 1.0               # 1/b
    x_time_const: 0.5        # m/b   # 1/(2*pi*Fl)  
    # y-direction parameters
    y_min_force: 3.0        # 5.0
    y_max_force: 100.0
    y_max_vel: 1.2
    y_gain: 1.0              # 1/b
    y_time_const: 0.5        # m/b   # 1/(2*pi*Fl)
    # rotational (z-dir) parameters
    rot_min_torque: 0.1    # 0.5
    rot_max_torque: 30.0
    rot_max_rot_vel: 1.2
    rot_gain: 1.0
    rot_time_const: 0.5
