## joint_names
joint_names: [f_caster_rotation_joint, f_caster_r_wheel_joint, bl_caster_rotation_joint, bl_caster_r_wheel_joint, br_caster_rotation_joint, br_caster_r_wheel_joint]

defaults: &drive_defaults # default settings for all wheels, can per overwritten per wheel
  steer_ctrl: # Parameters for tuning Impedance-Controller
    spring: 15.0
    damp: 2.75
    virt_mass: 0.1
    d_phi_max: 10.0
    dd_phi_max: 40.0

wheels: &wheels # start front left, counter-clockwise for base_drive_chain compatibility
  - steer: f_caster_rotation_joint
    drive: f_caster_r_wheel_joint
    wheel_radius: 0.0782
  - steer: bl_caster_rotation_joint
    drive: bl_caster_r_wheel_joint
    steer_neutral_position: -180.0
    wheel_radius: 0.0782
    x_pos: -0.219122
    y_pos: 0.247322
  - steer: br_caster_rotation_joint
    drive: br_caster_r_wheel_joint
    wheel_radius: 0.0782
    x_pos: -0.219122
    y_pos: -0.247322


fts_controller:
  use_fts: true
  type: robotrainer_controllers/FTSController
  required_drive_mode: 3
  publish_rate: 50
  max_rot_velocity: 1.0 #0.2
  max_trans_velocity: 1.5 #0.2
  FTSBaseController:
    no_output: False
    update_rate: 200.0
    frame_id: "base_link"
    # trigger inversion of y and rotation outputs
    y_reversed: False
    rot_reversed: False
    # scale for negative x-direction
    backwards_max_force_scale: 0.5
    backwards_max_vel_scale: 0.7 #0.25
    # trigger using controllers
    x_force_controller: True
    y_force_controller: True
    rot_controller: True
    # x-direction parameters
    x_min_force: 3.0        # 5.0
    x_max_force: 100.0
    x_max_vel: 1.2
    x_gain: 1.0               # 1/b
    x_time_const: 0.5        # m/b   # 1/(2*pi*Fl)  
    # y-direction parameters
    y_min_force: 3.0        # 5.0
    y_max_force: 100.0
    y_max_vel: 1.2
    y_gain: 1.0              # 1/b
    y_time_const: 0.5        # m/b   # 1/(2*pi*Fl)
    # rotational (z-dir) parameters
    rot_min_torque: 0.1    # 0.5
    rot_max_torque: 30.0
    rot_max_rot_vel: 1.2
    rot_gain: 1.0
    rot_time_const: 0.5

  defaults: *drive_defaults
  wheels: *wheels
